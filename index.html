<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Anonymous Bot</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 450px;
    }
    h1 { color: #38bdf8; margin-bottom: 0.5rem; }
    p { color: #94a3b8; line-height: 1.6; }
    .badge {
      display: inline-block;
      background: #059669;
      color: #fff;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    code {
      background: #334155;
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      color: #f1f5f9;
      font-family: monospace;
      direction: ltr;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● آنلاین روی Vercel</div>
    <h1>🤖 ربات پیام ناشناس تلگرام</h1>
    <p>سرورلس فانکشن با موفقیت مستقر شده و آماده دریافت پیام‌هاست.</p>
    <p>مسیر وبهوک تلگرام:<br><code>/api/bot</code></p>
  </div>
</body>
</html>
